{% extends "admin/base.html" %}

{% block content %}

<h1>Products</h1>

<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Price</th>
    <th>PV</th>
    <th>Image</th>
</tr>

{% for product in products %}

<tr>

<td>{{ product.id }}</td>
<td>{{ product.name }}</td>
<td>₹{{ product.price }}</td>
<td>{{ product.pv_value }}</td>

<td>
{% if product.image %}
<img src="{{ product.image }}" width="60">
{% endif %}
</td>

</tr>

{% endfor %}

</table>

{% endblock %}
